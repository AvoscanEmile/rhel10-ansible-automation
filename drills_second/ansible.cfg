[defaults]
remote_user=red
host_key_checking=false
inventory=inventory.ini
interpreter_python=auto_silent
vault_password_file=.vault_pass
roles_path=roles:/root/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
collections_path=collections:/root/.ansible/collections:/usr/share/ansible/collections

[privilege_escalation]
become=true
become_method=sudo
become_user=root
become_ask_pass=false