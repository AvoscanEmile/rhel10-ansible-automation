---
- name: Data Structures and templates Drill
  hosts: all
  tasks:
    - name: Print information about variables
      ansible.builtin.debug:
        msg: "Service {{ item.1.name }} in tier {{ item.0.tier }} listens on port {{ item.0.port }} (state: {{ item.1.state }})"
      loop: "{{ workloads | subelements('services') }}"
    - name: Verify available space
      ansible.builtin.shell:
        cmd: "df --output=pcent / | tail -n 1 | tr -dc '0-9'"
      register: root_disk_usage
      changed_when: false
    - name: Print variable
      ansible.builtin.debug:
        msg: "Candidate node qualified"
      when:
        - ansible_facts['memtotal_mb']  >= 100
        - root_disk_usage.stdout | int < 90
        - ansible_facts['default_ipv4']['address'] != '192.168.122.11'
    - name: Ensure template presence
      ansible.builtin.template:
        src: report.j2
        dest: /report.txt
        mode: '0644'
- name: Complex Error Handling Drill
  hosts: all
  gather_facts: true
  tasks:
    - name: Complex execution block
      block:
        - name: Create lock file
          ansible.builtin.file:
            state: touch
            path: /tmp/deploy.lock
            mode: '0440'
        - name: Port conflict failure
          ansible.builtin.shell:
            cmd: "echo 'ERROR: Address already in use'; exit 98"
          when: simulate_failure == 'port_conflict'
        - name: Package missing failure
          ansible.builtin.shell:
            cmd: "echo 'Package httpd not found'; exit 1"
          when: simulate_failure == 'missing_package'
        - name: Succesful task
          ansible.builtin.debug:
            msg: "This task was succesful"
          when: simulate_failure == 'none'
      rescue:
        - name: Configure alternate port
          ansible.builtin.debug:
            msg: "Configured alternate port 8080"
          when: ansible_failed_result.rc == 98
        - name: Resolve dependency
          ansible.builtin.debug:
            msg: "Configure another dependency for the package"
          when: ansible_failed_result.stdout == 'Package httpd not found'
      always:
        - name: Make sure lock is absent
          ansible.builtin.file:
            path: /tmp/deploy.lock
            state: absent
