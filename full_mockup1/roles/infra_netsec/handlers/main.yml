---
- name: Restart network interface
  ansible.builtin.shell: |
    nmcli connection down enp2s0
    nmcli connection up enp2s0
  changed_when: true

- name: Rebuild GRUB file
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
  changed_when: true

- name: Restart autofs service
  ansible.builtin.service:
    name: autofs
    state: restarted
  changed_when: true

- name: Restore Context of folder
  ansible.builtin.command: restorecon -R /opt/app_data
  changed_when: true
