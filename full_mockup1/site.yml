---
- name: "My Site Playbook"
  hosts: all
  become: true
  gather_facts: true
  tasks:
   - name: "Distribute SSH keys to all hosts"
     ansible.posix.authorized_key:
      user: red
      state: present
      key: "{{ lookup('file', 'keys/id_rsa.pub') }}"
   - name: Disable password authentication via drop-in file
     ansible.builtin.copy:
      content: |
        PasswordAuthentication no
      dest: /etc/ssh/sshd_config.d/01-harden-auth.conf
      owner: root
      group: root
      mode: '0600'
     notify: Restart sshd
   - name: "Configure BaseOS"
     ansible.builtin.yum_repository:
      name: BaseOS
      baseurl: "http://mirror.stream.centos.org/10-stream/BaseOS/$basearch/os/"
      enabled: true
      gpgcheck: false
      description: BaseOS
   - name: "Configure AppStream"
     ansible.builtin.yum_repository:
      name: AppStream
      baseurl: "http://mirror.stream.centos.org/10-stream/AppStream/$basearch/os/"
      enabled: true
      gpgcheck: false
      description: AppStream
   - name: Setup Hostnames Based on inventory group
     ansible.builtin.hostname:
      name: "{{ group_names[0] }}-node{{ play_hosts.index(inventory_hostname) + 1 }}"
  handlers:
   - name: Restart sshd
     ansible.builtin.service:
      name: sshd
      state: restarted

- name: Apply official RHEL system roles to performance nodes
  hosts: alpha
  become: true
  vars:
   timesync_ntp_servers:
    - hostname: pool.ntp.org
      iburst: true
   tuned_profile: throughput-performance

  roles:
   - fedora.linux_system_roles.timesync
   - fedora.linux_system_roles.kernel_settings

- name: Apply Storage Config to Relevant Nodes
  hosts: beta
  roles:
   - infra_storage

- name: Apply NetSec Config to Relevant Nodes
  hosts: delta
  gather_facts: true
  roles:
   - infra_netsec

- name: Apply apps config to relevant nodes
  hosts: gamma
  gather_facts: false
  roles:
   - infra_app
