---
- name: Create group ops_core
  ansible.builtin.group:
    name: ops_core
    state: present

- name: Create user deploy_admin
  ansible.builtin.user:
    name: deploy_admin
    state: present
    groups:
      - wheel
      - ops_core
    append: true
    password_expire_max: 90
    password_expire_warn: 7

- name: Enforce specific system-wide umask
  ansible.builtin.lineinfile:
    line: umask 027
    dest: "{{ item }}"
    state: present
  loop:
    - /etc/profile
    - /etc/bashrc

- name: Allow ops_core passwordless sudo
  ansible.builtin.copy:
    content: "%ops_core ALL=(ALL) NOPASSWD: ALL"
    dest: /etc/sudoers.d/ops_core
    mode: '0600'
    owner: root
    group: root

- name: Change ip addresses only if eth1 is present
  community.general.nmcli:
    ifname: eth1
    conn_name: eth1
    type: ethernet
    state: present
    ip4: 192.168.122.50/24
    ip6: 2001:db8::50/64
  when:
    - ansible_facts['eth1'] is defined
    - ansible_facts['eth1']['active'] | bool

- name: Ensure proper host resolution
  ansible.builtin.lineinfile:
    line: "{{ item }}"
    dest: /etc/hosts
    state: present
  loop:
    - "192.168.122.250 nfs.internal.net"
    - "192.168.122.251 repo.internal.net"

- name: Enforce strict Chrony baseline configuration
  ansible.builtin.copy:
    content: "server 192.168.122.1 iburst\n"
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart chronyd

- name: Create systemd service for archiving
  ansible.builtin.copy:
    dest: /etc/systemd/system/log-archive.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Log Archiving Script

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/logger "This is a systemd message"

- name: Create a timer for running the service
  ansible.builtin.copy:
    dest: /etc/systemd/system/log-archive.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Timer for logger service

      [Timer]
      OnCalendar=*-*-* 00:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Ensure timer is enabled
  ansible.builtin.systemd_service:
    name: log-archive.timer
    state: started
    enabled: true

- name: Ensure tuned is installed
  ansible.builtin.package:
    name: tuned
    state: present

- name: Ensure tuned is enabled and active
  ansible.builtin.service:
    name: tuned
    state: started
    enabled: true

- name: Verify current tuned profile
  ansible.builtin.command: tuned-adm active
  register: infrastructure_baseline_tuned_current
  changed_when: false

- name: Ensure proper tuned profile
  ansible.builtin.command: tuned-adm profile virtual-guest
  when: "'Current active profile: virtual-guest' not in infrastructure_baseline_tuned_current.stdout"
  changed_when: true

- name: Create a persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: '2755'
  notify: Restart and flush journal

- name: Check current default kernel configuration
  ansible.builtin.command: grubby --info=DEFAULT
  register: infrastructure_baseline_default_kernel_info
  changed_when: false

- name: Force boot arguments across all kernels via grubby
  ansible.builtin.command: grubby --update-kernel=ALL --args="audit=1 selinux=1"
  when: >
    'audit=1' not in infrastructure_baseline_default_kernel_info.stdout or
    'selinux=1' not in infrastructure_baseline_default_kernel_info.stdout
  changed_when: true

- name: Enforce multi-user.target as default target
  ansible.builtin.file:
    src: /usr/lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true
