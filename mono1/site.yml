---
- name: Perform configuration on all nodes
  hosts: all
  gather_facts: false
  tasks:
    - name: Distribute keys
      ansible.posix.authorized_key:
        key: "{{ lookup('file', 'keys/mockup_key.pub') }}"
        user: red
        state: present
    - name: Disable passwordauth
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/auth.conf
        content: |
          PasswordAuthentication No
        group: root
        owner: root
        mode: '0644'
      notify: Restart sshd
    - name: Configure repositories
      ansible.builtin.yum_repository:
        baseurl: "{{ item.url }}"
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        state: present
        gpgcheck: false
      loop:
        - { name: BaseOS, description: BaseOS, url: http://mirror.stream.centos.org/10-stream/BaseOS/$basearch/os/ }
        - { name: AppStream, description: AppStream, url: http://mirror.stream.centos.org/10-stream/AppStream/$basearch/os/ }
    - name: Ensure package presence
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - firewalld
        - httpd
        - rsync
        - nfs-utils
        - tar
    - name: Ensure telnet is absent
      ansible.builtin.package:
        name: telnet
        state: absent
    - name: Ensure services are enabled and active
      ansible.builtin.service:
        state: started
        enabled: true
        name: "{{ item }}"
      loop:
        - chronyd
        - firewalld
  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
- name: Perform Common Configuration
  hosts: common
  gather_facts: false
  roles:
    - common
- name: Configure Web Node
  hosts: web
  gather_facts: false
  roles:
    - web
- name: Configure storage node
  hosts: storage
  gather_facts: false
  roles:
    - storage
- name: Configure timesync with multiple servers and a fallback pool
  hosts: node1.example.com
  gather_facts: false
  vars:
    timesync_ntp_servers:
      - hostname: 0.rhel.pool.ntp.org
        iburst: true
      - hostname: 1.rhel.pool.ntp.org
        iburst: true
      - hostname: 2.rhel.pool.ntp.org
        iburst: true
    timesync_step_threshold: 1.0
  roles:
    - linux-system-roles.timesync
- name: Configure the network role
  hosts: node1.example.com
  gather_facts: false
  vars:
    network_connections:
      - name: prod_enp2s0
        autoconnect: true
        interface_name: enp2s0
        type: ethernet
        zone: internal
        ip:
          address:
            - 192.168.100.50/24
          gateway4: 192.168.100.1
          dns:
            - 192.168.122.1
            - 8.8.8.8
          dns_search:
            - lab.example.com
            - example.com
          route:
            - network: 10.50.0.0
              prefix: 16
              gateway: 192.168.100.254
        persistent_state: present
  roles:
    - linux-system-roles.network
- name: Configure firewalld with role
  hosts: node1.example.com
  gather_facts: false
  vars:
    firewall:
      - zone: internal
        service:
          - http
          - ssh
          - https
        state: enabled
        permanent: true
        runtime: true
        previous: kept
        interface: enp2s0
        port: 8443/tcp
  roles:
    - linux-system-roles.firewall
- name: Configure storage with storage role
  hosts: node1.example.com
  gather_facts: false
  vars:
    storage_pools:
      - name: vg_data
        disks:
          - /dev/vdb
        volumes:
          - name: lv_app
            size: "2G"
            mount_point: /srv/appdata
            mount_options: 'defaults,noatime'
            fs_type: xfs
            state: present
          - name: lv_logs
            size: "1.5G"
            mount_point: /var/log/applogs
            mount_options: 'defaults'
            fs_type: ext4
            state: present
          - name: lv_swap
            size: "1G"
            fs_type: swap
            state: present
  roles:
    - linux-system-roles.storage
- name: Configure SELinux with role
  hosts: node1.example.com
  gather_facts: false
  vars:
    selinux_policy: targeted
    selinux_state: enforcing
    selinux_booleans:
      - name: httpd_can_network_connect
        state: true
        persistent: true
      - name: container_use_devices
        state: true
        persistent: true
    selinux_fcontexts:
      - target: '/srv/appdata(/.*)?'
        setype: httpd_sys_rw_content_t
        state: present
    selinux_restore_dirs:
      - /srv/appdata
    selinux_ports:
      ports: 8843
      proto: tcp
      setype: http_port_t
      state: present
  roles:
    - linux-system-roles.selinux
