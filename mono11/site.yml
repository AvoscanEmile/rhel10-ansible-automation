---
- name: Perform basic provisioning
  hosts: all
  gather_facts: true
  tasks:
    - name: Distribute keys
      ansible.posix.authorized_key:
        key: "{{ lookup('file', 'keys/mockup_key.pub') }}"
        user: red
        state: present
    - name: Disable password auth
      ansible.builtin.copy:
        content: |
          PasswordAuthentication no
        dest: /etc/ssh/sshd_config.d/auth.conf
        mode: '0644'
        owner: root
        group: root
      notify: Restart sshd
    - name: Distribute repositories
      ansible.builtin.yum_repository:
        name: "{{ item.name }}"
        description: "{{ item.desc }}"
        baseurl: "{{ item.url }}"
        gpgcheck: false
        enabled: true
        state: present
        exclude:
          - kernel*
          - shim*
          - grub*
      loop:
        - { name: BaseOS, desc: BaseOS, url: http://mirror.stream.centos.org/10-stream/BaseOS/$basearch/os/ }
        - { name: AppStream, desc: AppStream, url: http://mirror.stream.centos.org/10-stream/AppStream/$basearch/os/ }
  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
