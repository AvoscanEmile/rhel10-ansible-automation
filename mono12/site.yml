---
- name: Ensure basic configuration across all nodes
  hosts: all
  gather_facts: false
  tasks:
    - name: Configure key distribution
      ansible.posix.authorized_key:
        key: "{{ lookup('file', 'keys/mockup_key.pub') }}"
        user: red
        state: present
    - name: Turn off password auth
      ansible.builtin.copy:
        content: |
          PasswordAuthentication no
        dest: /etc/ssh/sshd_config.d/auth.conf
        mode: '0644'
      notify: Restart sshd
    - name: Configure repositories
      ansible.builtin.yum_repository:
        name: "{{ item.name }}"
        description: "{{ item.desc }}"
        baseurl: "{{ item.url }}"
        state: present
        gpgcheck: false
        enabled: true
      loop:
        - { name: BaseOS, desc: BaseOS, url: http://mirror.stream.centos.org/10-stream/BaseOS/$basearch/os/ }
        - { name: AppStream, desc: AppStream, url: http://mirror.stream.centos.org/10-stream/AppStream/$basearch/os/ }
  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
