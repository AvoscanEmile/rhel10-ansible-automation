---
- name: Configure partitions in target node
  community.general.parted:
    label: gpt
    number: "{{ item.number }}"
    part_start: "{{ item.start }}"
    part_end: "{{ item.end }}"
    state: present
    device: /dev/vdb
  loop:
    - { number: 1, start: 0%, end: 2GiB }
    - { number: 2, start: 2GiB, end: 100% }
- name: Configure VG
  community.general.lvg:
    vg: vg_data
    pvs:
      - /dev/vdb2
    state: present
- name: Configure LVs
  community.general.lvol:
    lv: "{{ item.lv }}"
    size: "{{ item.size }}"
    state: present
    vg: vg_data
  loop:
    - { lv: lv_app, size: 1.5G }
    - { lv: lv_swap, size: 1G }
- name: Configure filesystems
  community.general.filesystem:
    dev: "{{ item.dev }}"
    fstype: "{{ item.fstype }}"
    state: present
  loop:
    - { dev: /dev/vdb1, fstype: ext4 }
    - { dev: /dev/vg_data/lv_app, fstype: xfs }
    - { dev: /dev/vg_data/lv_swap, fstype: swap }
- name: Ensure swap is present in fstab
  ansible.posix.mount:
    path: none
    fstype: swap
    state: present
    src: /dev/vg_data/lv_swap
- name: Ensure swap is active
  ansible.builtin.command:
    cmd: swapon -a
  changed_when: false
- name: Ensure mountpaths and directories exist
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    mode: '0755'
    group: root
    owner: root
  loop:
    - /mnt/nfs_backup
    - /mnt/nfs_home
    - /mnt/lvapp
    - /mnt/storage
    - /var/backups
    - /opt/restore
- name: Ensure directories are properly mounted
  ansible.posix.mount:
    state: mounted
    path: "{{ item.path }}"
    fstype: "{{ item.fstype }}"
    src: "{{ item.src }}"
  loop:
    - { src: /dev/vdb1, path: /mnt/storage, fstype: ext4 }
    - { src: /dev/vg_data/lv_app, path: /mnt/lvapp, fstype: xfs }
    - { src: 192.168.122.1:/opt/nfs/backup, path: /mnt/nfs_backup, fstype: nfs4 }
    - { src: 192.168.122.1:/opt/nfs/home, path: /mnt/nfs_home, fstype: nfs4 }
- name: Archive folder
  community.general.archive:
    path:
      - /etc/systemd
    dest: /var/backups/systemd_config.tar.gz
    format: gz
    mode: '0644'
    owner: red
    group: red
- name: Verify presence of /opt/systemd/network
  ansible.builtin.stat:
    path: /opt/restore/systemd/network
  register: storage_path
- name: Extract folder only if it doesnt exist
  ansible.builtin.unarchive:
    src: /var/backups/systemd_config.tar.gz
    dest: /opt/restore/
    remote_src: true
    mode: '0644'
    owner: red
    group: red
  when: not storage_path.stat.exists
