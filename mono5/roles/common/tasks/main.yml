---
- name: Ensure package presence
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - chrony
    - tar
    - policycoreutils-python-utils
    - nfs-utils
    - httpd
- name: Ensure package absence
  ansible.builtin.package:
    name: cockpit
    state: absent
- name: Configure network
  community.general.nmcli:
    ifname: enp2s0
    conn_name: enp2s0
    state: present
    type: ethernet
    autoconnect: true
    ip4: "{{ '10.0.10.11/24' if ansible_host == '192.168.122.12' else '10.0.10.12/24' }}"
    gw4: 10.0.10.1
    dns4:
      - 10.0.10.1
    method4: manual
- name: Ensure connection is up
  community.general.nmcli:
    conn_name: enp2s0
    state: up
- name: Configure host resolution
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    mode: '0644'
    owner: root
    group: root
- name: Configure users
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - wheel
    append: true
    password: "{{ 'mypass' | password_hash('sha512', 'mysalt') }}"
    password_expire_max: 90
    password_expire_min: 7
  loop:
    - sysadmin
    - auditor
- name: Ensure sysadmin has passwordless sudo
  ansible.builtin.copy:
    content: |
      sysadmin ALL=(ALL) NOPASSWD: ALL
    dest: /etc/sudoers.d/sysadmin
    mode: '0440'
    owner: root
    group: root
- name: Ensure selinux is enforcing
  ansible.posix.selinux:
    state: enforcing
    policy: targeted
    update_kernel_param: true
- name: Configure chrony
  ansible.builtin.template:
    dest: /etc/chrony.conf
    mode: '0644'
    owner: root
    group: root
    src: chrony.j2
  notify: Restart chronyd
- name: Configure directory properly
  ansible.builtin.file:
    state: directory
    mode: 'u=rwX,g=rX,o=rX'
    path: /srv/app_data
    owner: sysadmin
    group: wheel
- name: Ensure limits are set properly
  ansible.builtin.blockinfile:
    block: |
      * soft nofile 4096
      * hard nofile 8192
    path: /etc/security/limits.conf
    state: present