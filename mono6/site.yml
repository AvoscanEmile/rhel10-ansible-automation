---
- name: Configure all nodes
  hosts: all
  gather_facts: false
  tasks:
    - name: Distribute public keys
      ansible.posix.authorized_key:
        key: "{{ lookup('file', 'keys/mockup_key.pub') }}"
        user: red
        state: present
    - name: Ensure password auth is off
      ansible.builtin.copy:
        content: |
          PasswordAuthentication No
        dest: /etc/ssh/sshd_config.d/auth.conf
        mode: '0644'
        owner: root
        group: root
      notify: Restart sshd
    - name: Ensure repositories are present
      ansible.builtin.yum_repository:
        baseurl: "{{ item.url }}"
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        state: present
        gpgcheck: false
      loop:
        - { url: 'http://mirror.stream.centos.org/10-stream/BaseOS/$basearch/os/', name: BaseOS, description: BaseOS }
        - { url: 'http://mirror.stream.centos.org/10-stream/AppStream/$basearch/os/', name: AppStream, description: AppStream }
  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
- name: Configure common nodes
  hosts: common
  roles:
    - common
- name: Configure storage nodes
  hosts: storage
  roles:
    - storage
- name: Configure app nodes
  hosts: app
  roles:
    - app
