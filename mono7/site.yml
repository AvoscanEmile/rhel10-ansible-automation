---
- name: Perform basic configuration on all nodes
  gather_facts: false
  hosts: all
  tasks:
    - name: Distribute public keys
      ansible.posix.authorized_key:
        key: "{{ lookup('file', 'keys/mockup_key.pub') }}"
        user: red
        state: present
    - name: Ensure password auth is off
      ansible.builtin.copy:
        content: |
          PasswordAuthentication No
        dest: /etc/ssh/sshd_config.d/auth.conf
        mode: '0644'
        owner: root
        group: root
      notify: Restart sshd
    - name: Ensure repositories are present
      ansible.builtin.yum_repository:
        baseurl: "{{ item.url }}"
        name: "{{ item.name }}"
        description: "{{ item.desc }}"
        state: present
        gpgcheck: false
        exclude: "kernel* shim* grub*"
      loop:
        - { name: BaseOS, desc: BaseOS, url: http://mirror.stream.centos.org/10-stream/BaseOS/$basearch/os/ }
        - { name: AppStream, desc: AppStream, url: http://mirror.stream.centos.org/10-stream/AppStream/$basearch/os/ }
  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
- name: Configure common role
  hosts: common
  gather_facts: false
  roles:
    - common
- name: Configure web role
  hosts: web
  gather_facts: false
  roles:
    - web
- name: Configure storage role
  hosts: storage
  gather_facts: false
  roles:
    - storage
