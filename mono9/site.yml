---
- name: Perform basic configuration on all nodes
  hosts: all
  gather_facts: false
  tasks:
    - name: Distribute public keys
      ansible.posix.authorized_key:
        key: "{{ lookup('file', 'keys/mockup_key.pub') }}"
        user: red
        state: present
    - name: Ensure PasswordAuth is off
      ansible.builtin.copy:
        content: |
          PasswordAuthentication No
        dest: /etc/ssh/sshd_config.d/auth.conf
        mode: '0440'
        owner: root
        group: root
      notify: Restart sshd
    - name: Ensure repositories are plesent
      ansible.builtin.yum_repository:
        baseurl: "{{ item.url }}"
        description: "{{ item.desc }}"
        name: "{{ item.name }}"
        gpgcheck: false
        exclude:
          - 'kernel*'
          - 'grub*'
          - 'shim*'
      loop:
        - { name: BaseOS, desc: BaseOS, url: http://mirror.stream.centos.org/10-stream/BaseOS/$basearch/os/ }
        - { name: AppStream, desc: AppStream, url: http://mirror.stream.centos.org/10-stream/AppStream/$basearch/os/ }
  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
# error_handling_demo.yml
- name: Demonstrate block, rescue, and always error handling
  hosts: all
  gather_facts: false
  tasks:
    - name: Attempt operations inside a block
      block:
        - name: Task 1 - Harmless operation
          ansible.builtin.debug:
            msg: "Starting critical block..."

        - name: Task 2 - Intentionally failing command
          ansible.builtin.command: /bin/false
          # This command exits with return code 1, triggering immediate block failure

        - name: Task 3 - Unreachable task
          ansible.builtin.debug:
            msg: "You will never see this message because Task 2 failed."

      rescue:
        - name: Rescue 1 - Handle the failure
          ansible.builtin.debug:
            msg: "Caught a task failure inside the block! Executing remediation/fallback..."

        - name: Rescue 2 - Perform recovery action
          ansible.builtin.copy:
            content: "Fallback configuration"
            dest: /tmp/fallback.txt
            mode: '0644'

      always:
        - name: Always 1 - Cleanup or final state check
          ansible.builtin.debug:
            msg: "This runs unconditionally, regardless of whether block succeeded or rescue triggered."

    - name: Task outside block
      ansible.builtin.debug:
        msg: "Play execution continues normally because rescue cleared the failure state."
